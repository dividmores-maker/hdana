<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة الطلاب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ee;--card:#fff;--ink:#3a2e24;--mute:#8a7b6c;--line:#f0e2cf;--acc:#ff8a3d;--red:#d94b4b}
@media (prefers-color-scheme:dark){:root{--bg:#1d1813;--card:#2a231c;--ink:#f6ebdc;--mute:#b3a592;--line:#3d3328;--acc:#ff9a52;--red:#ef7a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;line-height:1.7}
header{text-align:center;padding:24px 16px 8px}
h1{margin:0 0 4px;font-size:1.4rem;font-weight:800}
.sub{color:var(--mute)}
main{max-width:680px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:1.1rem;color:var(--acc)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g .w{grid-column:1/-1}
label{display:block;font-weight:600;margin:8px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:800;cursor:pointer;background:var(--line);color:var(--ink);min-width:100px}
.btn.p{background:var(--acc);color:#fff}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tab{border:0;background:var(--line);color:var(--ink);font:inherit;font-weight:600;padding:6px 16px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--acc);color:#fff}
.st{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.st:first-child{border-top:0}
.no{min-width:42px;text-align:center;font-weight:800;color:var(--acc)}
.inf{flex:1;min-width:0}
.inf b{display:block;word-break:break-word}
.inf small{color:var(--mute)}
.inf a{color:var(--mute);text-decoration:none}
.bd{font-size:.75rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--line)}
.st button{border:0;background:var(--line);color:var(--ink);border-radius:10px;padding:5px 10px;font:inherit;cursor:pointer}
.st button.d{color:var(--red)}
.empty{text-align:center;color:var(--mute);padding:20px}
a.lk{color:var(--acc);font-weight:600;text-decoration:none}
.st{flex-wrap:wrap}.inf{flex:1 1 140px}
.pw{font-family:monospace;letter-spacing:1px}.pw u{font-weight:800;color:var(--acc);text-decoration:none}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0}
.cd{border:2px dashed #999;border-radius:14px;padding:0 0 10px;break-inside:avoid;color:#000;background:#fff;text-align:center;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cd .hd{display:flex;justify-content:space-between;align-items:center;background:#ff8a3d;color:#fff;padding:6px 12px;font-weight:800}
.cd .cb{background:#fff;color:#ff8a3d;border-radius:999px;padding:0 10px;font-size:.85rem}
.cd .nm{font-size:1.15rem;font-weight:800;margin:8px 8px 0}
.cd .sn{color:#555;font-size:.8rem}
.cd .bw{padding:6px 14px 0}
.cd .n{font-family:monospace;letter-spacing:3px;margin-top:2px}
.cd .pwb{display:inline-flex;gap:8px;align-items:center;border:2px solid #000;border-radius:10px;padding:2px 14px;margin-top:6px}
.cd .pwb b{font-family:monospace;font-size:1.3rem;letter-spacing:4px}
.cd .ft{font-size:.7rem;color:#555;margin-top:6px}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
</style>

<style id="theme">
/* ===== theme: purple neon glass (same as home page) ===== */
:root{color-scheme:dark;--bg:#0d0014;--card:rgba(255,255,255,.04);--ink:#fff;--mute:rgba(255,255,255,.55);--line:rgba(168,85,247,.22);--acc:#a855f7;--acc2:#7c3aed;--hi:#c084fc;--hw:rgba(168,85,247,.13);--nt:rgba(34,197,94,.11);--red:#f87171;--ok:#4ade80;--sh:0 8px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06);--ring:rgba(168,85,247,.35);--ghost:rgba(168,85,247,.14)}
html{background:#0d0014}
body{background:radial-gradient(ellipse 80% 55% at 50% 0%,rgba(124,58,237,.4),transparent 60%),radial-gradient(ellipse 55% 45% at 85% 85%,rgba(168,85,247,.22),transparent 55%),radial-gradient(ellipse 45% 40% at 10% 70%,rgba(59,130,246,.16),transparent 55%),linear-gradient(180deg,#0d0014,#12001f 45%,#0a0018);background-attachment:fixed;color:#fff;min-height:100vh}
header h1{font-weight:900;font-size:1.6rem;background:linear-gradient(135deg,#fff 30%,var(--hi));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card h2{color:var(--hi);font-weight:800;display:flex;align-items:center;gap:10px}
.card h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
label{color:var(--mute);font-weight:600;font-size:.9rem}
input,select,textarea{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;color:#fff;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--hi);box-shadow:0 0 0 4px var(--ring)}
option{background:#1a0629;color:#fff}
::placeholder{color:rgba(255,255,255,.35)}
.btn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff;border-radius:14px;font-weight:700;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.p,.btn.g+.btn.p{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent;box-shadow:0 8px 24px rgba(124,58,237,.45)}
.btn.p:hover{box-shadow:0 12px 32px rgba(168,85,247,.6)}
.btn:focus-visible,.tab:focus-visible,.st button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.tabs{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:5px}
.tab{background:transparent;color:var(--mute);font-weight:700;transition:all .2s}
.tab.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;box-shadow:0 4px 16px rgba(124,58,237,.5)}
.st{border-top:1px solid var(--line)}
.st button{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:10px;transition:background .2s}
.st button:hover{background:var(--ghost)}
.st button.d{color:var(--red)}
.no,.nb{width:40px;min-width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--ghost);border:1px solid var(--line);color:var(--hi);font-weight:900;flex:none}
.bd{background:var(--ghost);color:var(--hi);border:1px solid var(--line);font-weight:800}
.bd.p{background:rgba(74,222,128,.18);color:var(--ok);border-color:rgba(74,222,128,.4)}
.bd.a{background:rgba(248,113,113,.18);color:var(--red);border-color:rgba(248,113,113,.4)}
.pw{color:var(--mute)}.pw u{color:var(--hi)}
.pa.on.p{background:var(--ok);color:#052e16;border-color:transparent;box-shadow:0 0 16px rgba(74,222,128,.4)}
.pa.on.a{background:var(--red);color:#2a0606;border-color:transparent;box-shadow:0 0 16px rgba(248,113,113,.4)}
.mb.on{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent}
.stats span{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.stats .ok{color:var(--ok)}.stats .no{color:var(--red);background:rgba(255,255,255,.05);width:auto;height:auto;min-width:0;display:inline;border-radius:999px;font-weight:800}
.mp{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px}
.ms{border-top:1px solid var(--line)}
.empty{color:var(--mute)}
a,a.lk{color:var(--hi);font-weight:700}
.toast{background:rgba(30,8,50,.92);color:#fff;border:1px solid var(--ring);box-shadow:0 12px 40px rgba(124,58,237,.5);backdrop-filter:blur(12px)}
/* parents */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(124,58,237,.55),rgba(168,85,247,.2) 70%,transparent);border-bottom:1px solid var(--line);border-radius:0 0 36px 36px;padding:32px 16px 48px}
.hero::before{content:"";position:absolute;width:340px;height:340px;top:-170px;left:50%;margin-left:-170px;border-radius:50%;background:rgba(168,85,247,.35);filter:blur(70px)}
.hero>*{position:relative}
.sch{color:var(--hi);font-weight:700;opacity:1}
.hero h1{font-weight:900}
.who{background:rgba(255,255,255,.07);border:1px solid var(--line);backdrop-filter:blur(10px)}
.who .cl{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff}
.who button{background:rgba(255,255,255,.12);color:#fff;border:1px solid var(--line)}
main{margin-top:-24px}
.row{border-top:1px solid var(--line)}
.row .em{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:14px;background:var(--ghost);border:1px solid var(--line);font-size:1.4rem}
.row.hw,.row.note{border:1px solid var(--line);border-radius:16px;padding:12px}
.row.note{border-color:rgba(74,222,128,.3)}
a.row{color:#fff;transition:transform .2s,border-color .2s}a.row:hover{border-color:var(--hi)}
small{color:var(--hi)}
.msg{border-radius:14px;border:1px solid rgba(74,222,128,.25);border-inline-start:4px solid var(--ok)}
.msg small{color:var(--mute)}
details.card summary{list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"▾";color:var(--hi);transition:transform .2s}
details.card[open] summary::after{transform:rotate(180deg)}
h3{color:var(--mute)}
.fr{border-color:var(--hi);box-shadow:0 0 24px var(--ring)}
/* detail */
.back{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px 16px;color:var(--hi)}
.files img,.pdf{border:1px solid var(--line);border-radius:16px}
.pdf{background:var(--card);color:#fff}
@media print{html,body{background:#fff!important}}
/* admin */
.day{border-top:1px solid var(--line)}
.day button,.fl button{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:10px;transition:background .2s}
.day button:hover,.fl button:hover{background:var(--ghost)}
.fl{border-top:1px solid var(--line)}
.fl button,.btn.d{color:var(--red)}
details.dt{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
details.dt summary{color:var(--hi);font-weight:700}
.up{background:var(--ghost);border:1px dashed var(--hi);color:var(--hi);border-radius:14px;font-weight:700;transition:background .2s}
.up:hover{background:rgba(168,85,247,.24)}

/* ===== school name ===== */
header{display:flex;flex-direction:column;align-items:center}
header>*{order:2}
header::before{order:0}
header::after{content:"مدارس النصر سكول";order:1;font-weight:800;font-size:1.1rem;color:var(--hi);margin-bottom:6px}
.sch{font-size:0}.sch::before{font-size:1rem}.sch::after{content:"مدارس النصر سكول";display:block;font-size:1.15rem;font-weight:800;color:#fff;margin-bottom:6px}

<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div id="pr"></div>
<script type="text/fb-app">
const KEY='nursery_students_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const digits=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(16).slice(2,6);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function load(){try{const a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a:[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(L));return true}catch(e){toast('مقدرتش أحفظ: '+e.message);return false}}
let L=load(),flt='all',q='',editId=null;

function shell(){
  $('root').innerHTML=`<header><h1>إدارة الطلاب</h1><div class="sub" id="cnt"></div></header><main>
  <section class="card"><h2 id="ft">إضافة طالب</h2><div class="g">
    <div class="w"><label>الاسم</label><input id="nm"></div>
    <div><label>الرقم</label><input id="no" inputmode="numeric"></div>
    <div><label>الفصل</label><select id="cl"><option value="kg1">KG1</option><option value="kg2">KG2</option></select></div>
    <div class="w"><label>موبايل ولي الأمر (اختياري)</label><input id="ph" inputmode="tel"></div>
  </div><div class="btns"><button class="btn p" id="sv">إضافة</button><button class="btn" id="cx" hidden>إلغاء</button></div></section>
  <section class="card"><h2>الطلاب</h2><input id="sq" placeholder="ابحث بالاسم أو الرقم أو الموبايل">
    <div class="tabs" id="tb"></div><div id="ls"></div></section>
  <section class="card"><h2>الباركود</h2><p style="margin:0 0 8px;color:var(--mute)">كل طالب جديد بياخد باركود (١٢ رقم) تلقائي. الباسورد بتاعه هو آخر ٤ أرقام من الباركود. الكروت بتتطبع للفلتر المختار (الكل أو KG1 أو KG2).</p>
    <div class="btns"><button class="btn" id="gb">توليد للي مالوش باركود</button><button class="btn p" id="pc">طباعة الكروت</button></div></section>
  <section class="card"><h2>تصدير واستيراد</h2><p style="margin:0 0 8px;color:var(--mute)">ملف CSV بيتفتح في Excel. ترتيب الأعمدة: الرقم، الاسم، الفصل، موبايل ولي الأمر.</p>
    <div class="btns"><button class="btn" id="ex">تصدير CSV</button><button class="btn" id="im">استيراد CSV</button></div><input type="file" id="fi" accept=".csv,text/csv" hidden></section>
  <p style="text-align:center"><a class="lk" href="nursery-admin.html">→ لوحة الأدمن</a> · <a class="lk" href="nursery-attendance.html">✅ الحضور والرسايل</a></p></main>`;
  $('sv').onclick=submit;
  $('cx').onclick=()=>resetForm();
  $('sq').oninput=e=>{q=e.target.value.trim();list()};
  $('ex').onclick=exportCsv;$('gb').onclick=genMissing;$('pc').onclick=printCards;
  $('im').onclick=()=>$('fi').click();
  $('fi').onchange=importCsv;
}
function resetForm(){
  editId=null;['nm','no','ph'].forEach(i=>$(i).value='');
  $('ft').textContent='إضافة طالب';$('sv').textContent='إضافة';$('cx').hidden=true;
}
function submit(){
  const nm=$('nm').value.trim(),no=digits($('no').value),ph=digits($('ph').value),cl=$('cl').value;
  if(!nm){toast('اكتب الاسم');return}
  if(no&&L.some(x=>x.no===no&&x.id!==editId)){toast('الرقم ده مستخدم لطالب تاني');return}
  if(editId){Object.assign(L.find(x=>x.id===editId),{name:nm,no,phone:ph,cls:cl})}
  else L.push({id:uid(),name:nm,no,phone:ph,cls:cl,bc:genCode()});
  if(save()){toast(editId?'اتعدل ✅':'اتضاف ✅');const keep=cl;resetForm();$('cl').value=keep;list();$('nm').focus()}
}
function list(){
  const cnt={all:L.length,kg1:L.filter(x=>x.cls==='kg1').length,kg2:L.filter(x=>x.cls==='kg2').length};
  $('cnt').textContent=`${cnt.all} طالب · KG1: ${cnt.kg1} · KG2: ${cnt.kg2}`;
  $('tb').innerHTML=[['all','الكل'],['kg1','KG1'],['kg2','KG2']].map(t=>`<button class="tab ${flt===t[0]?'on':''}" data-f="${t[0]}">${t[1]} (${cnt[t[0]]})</button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{flt=b.dataset.f;list()});
  const ql=q.toLowerCase();
  const rows=L.filter(x=>(flt==='all'||x.cls===flt)&&(!ql||(x.name+' '+x.no+' '+x.phone).toLowerCase().includes(ql)))
    .sort((a,b)=>a.cls.localeCompare(b.cls)||(+a.no||1e9)-(+b.no||1e9)||a.name.localeCompare(b.name,'ar'));
  $('ls').innerHTML=rows.length?rows.map(s=>`<div class="st"><span class="no">${esc(s.no||'—')}</span><div class="inf"><b>${esc(s.name)}</b>${s.bc?`<small class="pw">🔖 ${s.bc.slice(0,8)}<u>${s.bc.slice(8)}</u></small>`:''}${s.phone?`<small><a href="tel:${esc(s.phone)}">${esc(s.phone)}</a></small>`:''}</div><span class="bd">${s.cls.toUpperCase()}</span><button data-b="${s.id}">باركود</button><button data-e="${s.id}">تعديل</button><button class="d" data-x="${s.id}">مسح</button></div>`).join(''):'<div class="empty">مفيش طلاب هنا لسه 🧸</div>';
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{
    const s=L.find(x=>x.id===b.dataset.b);
    if(s.bc&&!confirm('الباركود الجديد هيبطّل القديم والكارت المطبوع. متأكد؟'))return;
    s.bc=genCode();if(save()){toast('اتولد باركود ✅');list()}
  });
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{
    const s=L.find(x=>x.id===b.dataset.e);editId=s.id;
    $('nm').value=s.name;$('no').value=s.no;$('ph').value=s.phone||'';$('cl').value=s.cls;
    $('ft').textContent='تعديل طالب';$('sv').textContent='حفظ';$('cx').hidden=false;
    window.scrollTo({top:0,behavior:'smooth'});
  });
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{
    const s=L.find(x=>x.id===b.dataset.x);
    if(confirm('تمسح '+s.name+'؟')){L=L.filter(x=>x.id!==s.id);if(save()){if(editId===s.id)resetForm();toast('اتمسح');list()}}
  });
}
function genCode(){let c;do{const a=crypto.getRandomValues(new Uint8Array(12));c=Array.from(a,(b,i)=>i?b%10:1+b%9).join('')}while(L.some(x=>x.bc===c));return c}
function genMissing(){const m=L.filter(x=>!x.bc);if(!m.length){toast('كل الطلاب ليهم باركود');return}m.forEach(x=>x.bc=genCode());if(save()){toast('اتولد '+m.length+' باركود ✅');list()}}
const C128='212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
function code128(txt){
  const v=[105];let sum=105;
  for(let i=0;i<txt.length;i+=2){const x=+txt.substr(i,2);v.push(x);sum+=x*(i/2+1)}
  v.push(sum%103,106);
  let x=10,r='';
  for(const c of v){const p=C128[c];for(let i=0;i<p.length;i++){const n=+p[i];if(i%2===0)r+=`<rect x="${x}" width="${n}" height="50"/>`;x+=n}}
  x+=10;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x} 50" preserveAspectRatio="none" style="width:100%;height:70px"><g fill="#000">${r}</g></svg>`;
}
function printCards(){
  const rows=L.filter(x=>x.bc&&(flt==='all'||x.cls===flt)).sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name,'ar'));
  if(!rows.length){toast('مفيش طلاب ليهم باركود');return}
  let school='';try{school=(JSON.parse(localStorage.getItem('nursery_data_v1'))||{}).school||''}catch(e){}
  $('pr').innerHTML=rows.map(s=>`<div class="cd"><div class="hd"><span>${'مدارس النصر سكول'}</span><span class="cb">${s.cls.toUpperCase()}</span></div><div class="nm">${esc(s.name)}</div>${s.no?`<div class="sn">رقم ${esc(s.no)}</div>`:''}<div class="bw">${code128(s.bc)}</div><div class="n">${s.bc}</div><div class="pwb"><span>الباسورد</span><b>${s.bc.slice(-4)}</b></div><div class="ft">امسح الباركود أو اكتبه في صفحة الأهالي</div></div>`).join('');
  setTimeout(()=>window.print(),50);
}
function exportCsv(){
  const cell=v=>'"'+String(v||'').replace(/"/g,'""')+'"';
  const lines=['الرقم,الاسم,الفصل,موبايل ولي الأمر'].concat(L.map(s=>[s.no,s.name,s.cls.toUpperCase(),s.phone].map(cell).join(',')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='students.csv';a.click();URL.revokeObjectURL(a.href);
}
function parseLine(l){const r=[];let c='',inq=false;for(const ch of l){if(ch==='"')inq=!inq;else if(ch===','&&!inq){r.push(c);c=''}else c+=ch}r.push(c);return r.map(x=>x.trim())}
function importCsv(){
  const f=$('fi').files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const lines=r.result.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());
    if(lines.length&&/الاسم|name/i.test(lines[0]))lines.shift();
    let n=0,skip=0;
    for(const ln of lines){
      const c=parseLine(ln),no=digits(c[0]||''),nm=(c[1]||'').trim();
      if(!nm||(no&&L.some(x=>x.no===no))){skip++;continue}
      L.push({id:uid(),name:nm,no,cls:/2/.test(c[2]||'')?'kg2':'kg1',phone:digits(c[3]||''),bc:genCode()});n++;
    }
    if(save()){toast(`اتضاف ${n}${skip?' · اتخطى '+skip:''}`);list()}
    $('fi').value='';
  };
  r.readAsText(f,'utf-8');
}
shell();list();
